[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fintube-hx"
version = "0.1.0.dev6"
description = "Standalone Community fin-tube heat exchanger baseline candidate"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party_licenses/**/*"]
requires-python = ">=3.12,<3.13"
dependencies = ["CoolProp==8.0.0", "scipy==1.18.1", "ht==1.2.0", "fluids==1.3.1", "openpyxl==3.1.5"]

[project.scripts]
fintube-hx = "fintube_hx.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
